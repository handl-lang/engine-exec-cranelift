[package]
name = "hnl-engine-exec-cranelift"
version = "0.1.0"
edition = "2024"
description = "The cranelift eval engine for the eval operation (ADR-0044 §4, §7)."
license = "MIT"
repository = "https://github.com/handl-lang/engine-exec-cranelift"
homepage = "https://handl-lang.github.io/docs/engine-exec-cranelift/"
documentation = "https://handl-lang.github.io/docs/engine-exec-cranelift/reference/"
readme = "README.md"
keywords = ["handl", "engine", "eval", "cranelift", "jit"]
categories = ["development-tools", "compilers"]
# Git-install only: https://github.com/handl-lang/engine-exec-cranelift (no crates.io).
publish = false

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
# ADR-0128 Phase 6: platform crates are git deps; the workspace-root
# `[patch]` resolves them from the sibling `../host` checkout.
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-platform = { git = "https://github.com/handl-lang/host", branch = "main" }
hnl-engine = { git = "https://github.com/handl-lang/engine", branch = "main" }
hnl-engine-exec = { git = "https://github.com/handl-lang/engine-exec", branch = "main" }
hnl-engine-exec-tree-walk = { git = "https://github.com/handl-lang/engine-exec-tree-walk", branch = "main" }
handl-plugin-ffi = { git = "https://github.com/handl-lang/kit-ffi", branch = "main" }
handl-runtime = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-value = { git = "https://github.com/handl-lang/kernel", branch = "main" }
cranelift = { version = "0.115", features = ["frontend", "native"] }
cranelift-module = "0.115"
cranelift-jit = "0.115"
cranelift-object = "0.115"
serde_json = "1"
rustc-hash = "2"
stacker = "0.1"

[dev-dependencies]
handl-test-utils = { git = "https://github.com/handl-lang/host", branch = "main" }
hnl-engine-exec-bytecode = { git = "https://github.com/handl-lang/engine-exec-bytecode", branch = "main" }
handl-plugin-module = { git = "https://github.com/handl-lang/host", branch = "main" }
serde_json = "1"
