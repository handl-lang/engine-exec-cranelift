[package]
name = "hnl-engine-exec-cranelift"
version = "0.1.0"
edition = "2024"
description = "The **cranelift eval engine** for the eval operation (ADR-0044 §4, §7)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/handl-lang/engine-exec-cranelift"

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
# ADR-0128 Phase 6: platform crates are git deps; the workspace-root
# `[patch]` resolves them from the sibling `../host` checkout.
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-platform = { git = "https://github.com/handl-lang/host", branch = "main" }
hnl-engine = { git = "https://github.com/handl-lang/engine", branch = "main" }
hnl-engine-exec = { git = "https://github.com/handl-lang/engine-exec", branch = "main" }
hnl-engine-exec-tree-walk = { git = "https://github.com/handl-lang/engine-exec-tree-walk", branch = "main" }
handl-plugin-ffi = { git = "https://github.com/handl-lang/kit-ffi", branch = "main" }
handl-runtime = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-value = { git = "https://github.com/handl-lang/kernel", branch = "main" }
cranelift = { version = "0.115", features = ["frontend", "native"] }
cranelift-module = "0.115"
cranelift-jit = "0.115"
cranelift-object = "0.115"
serde_json = "1"
rustc-hash = "2"
stacker = "0.1"

[dev-dependencies]
handl-test-utils = { git = "https://github.com/handl-lang/host", branch = "main" }
hnl-engine-exec-bytecode = { git = "https://github.com/handl-lang/engine-exec-bytecode", branch = "main" }
handl-plugin-module = { git = "https://github.com/handl-lang/host", branch = "main" }
serde_json = "1"

[patch."https://github.com/handl-lang/engine"]
hnl-engine = { path = "../engine" }

[patch."https://github.com/handl-lang/engine-exec"]
hnl-engine-exec = { path = "../engine-exec" }

[patch."https://github.com/handl-lang/engine-exec-bytecode"]
hnl-engine-exec-bytecode = { path = "../engine-exec-bytecode" }

[patch."https://github.com/handl-lang/engine-exec-tree-walk"]
hnl-engine-exec-tree-walk = { path = "../engine-exec-tree-walk" }

[patch."https://github.com/handl-lang/engine-lex"]
hnl-engine-lex = { path = "../engine-lex" }

[patch."https://github.com/handl-lang/engine-lex-pattern"]
hnl-engine-lex-pattern = { path = "../engine-lex-pattern" }

[patch."https://github.com/handl-lang/engine-parse"]
hnl-engine-parse = { path = "../engine-parse" }

[patch."https://github.com/handl-lang/engine-parse-pratt"]
hnl-engine-parse-pratt = { path = "../engine-parse-pratt" }

[patch."https://github.com/handl-lang/engine-transform"]
hnl-engine-transform = { path = "../engine-transform" }

[patch."https://github.com/handl-lang/engine-transform-rewrite"]
hnl-engine-transform-rewrite = { path = "../engine-transform-rewrite" }

[patch."https://github.com/handl-lang/engine-typecheck"]
hnl-engine-typecheck = { path = "../engine-typecheck" }

[patch."https://github.com/handl-lang/kernel"]
handl-language = { path = "../kernel/crates/handl-language" }
handl-value = { path = "../kernel/crates/handl-value" }

[patch."https://github.com/handl-lang/kit-prelude"]
handl-plugin-ffi = { path = "../kit-ffi/modules/ffi" }

[patch."https://github.com/handl-lang/native"]
hnl-engine-exec-cranelift = { path = "../engine-exec-cranelift" }

[patch."https://github.com/handl-lang/otlp"]

[patch."https://github.com/handl-lang/kit-ffi"]
handl-plugin-ffi = { path = "../kit-ffi/modules/ffi" }

[patch."https://github.com/handl-lang/host"]
handl-kit-arrow-lower = { path = "../host/crates/handl-kit-arrow-lower" }
handl-platform = { path = "../host/crates/platform" }
handl-plugin-ext-diag = { path = "../host/crates/plugin-ext-diag" }
handl-plugin-module = { path = "../host/crates/plugin-module" }
handl-runtime = { path = "../host/crates/handl-runtime" }
handl-test-utils = { path = "../host/crates/handl-test-utils" }

