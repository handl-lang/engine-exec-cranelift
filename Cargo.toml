[package]
name = "handl-plugin-engine-exec-cranelift"
version.workspace = true
edition.workspace = true
description = "The **cranelift eval engine** for the eval operation (ADR-0044 §4, §7)."
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
# ADR-0128 Phase 6: platform crates are git deps; the workspace-root
# `[patch]` resolves them from the sibling `../platform` checkout.
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-platform = { git = "https://github.com/handl-lang/platform", branch = "main" }
plugin-engine = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-plugin-engine-exec = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-engine-exec-tree-walk = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-ffi = { git = "https://github.com/handl-lang/ffi", branch = "main" }
handl-runtime = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-value = { git = "https://github.com/handl-lang/kernel", branch = "main" }
cranelift = { version = "0.115", features = ["frontend", "native"] }
cranelift-module = "0.115"
cranelift-jit = "0.115"
cranelift-object = "0.115"
serde_json = "1"
rustc-hash = "2"

[dev-dependencies]
handl-test-utils = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-engine-exec-bytecode = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-module = { git = "https://github.com/handl-lang/platform", branch = "main" }
serde_json = "1"
